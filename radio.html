<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تطبيق إصطفاك - القنوات الدينية والبث الحي</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#F7F8F6',
                        olive: {
                            50: '#E8EDE5',
                            100: '#D2DBCC',
                            200: '#A7B69E',
                            300: '#7C9070',
                            400: '#566B4A',
                            500: '#33442E',
                            600: '#2A3725',
                            700: '#222B1E',
                            800: '#1A2117',
                            900: '#121610',
                        },
                        gold: {
                            50: '#FBF6E3',
                            100: '#F5E9C0',
                            200: '#EBD489',
                            300: '#E0BF5A',
                            400: '#D4AF37',
                            500: '#B8962C',
                            600: '#9A7C24',
                            700: '#74611B',
                            800: '#4E4113',
                            900: '#2E270C',
                        },
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                        amiri: ['Amiri', 'serif'],
                    },
                    boxShadow: {
                        soft: '0 4px 20px rgba(51, 68, 46, 0.08)',
                        card: '0 8px 30px rgba(51, 68, 46, 0.12)',
                        gold: '0 4px 20px rgba(212, 175, 55, 0.3)',
                    }
                }
            }
        }
    </script>
    <style>
        html { font-family: 'Cairo', sans-serif; scroll-behavior: smooth; }
        body { background-color: #f7f8f6; color: #33442e; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.6s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- الهيدر العلوي مع زر العودة -->
    <header class="sticky top-0 z-30 bg-[#3A4E35] text-white shadow-card rounded-b-[30px] px-6 py-4 border-b-2 border-[#D4AF37]">
        <div class="mx-auto flex max-w-3xl items-center justify-between">
            <button onclick="history.back()" class="flex items-center gap-2 rounded-xl bg-[#D4AF37] text-[#222B1E] px-4 py-2 text-sm font-bold transition-all hover:bg-white hover:text-[#33442E] shadow-md">
                <i class="fa-solid fa-arrow-right"></i>
                <span>السابق</span>
            </button>
            <h1 class="text-xl font-bold font-serif text-[#F5E9C0]">القنوات الدينية والبث الحي</h1>
            <a href="index.html" class="flex items-center gap-2 rounded-xl bg-[#D4AF37] text-[#222B1E] px-4 py-2 text-sm font-bold transition-all hover:bg-white hover:text-[#33442E] shadow-md">
                <span>الرئيسية</span>
                <i class="fa-solid fa-home"></i>
            </a>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="mx-auto max-w-3xl px-4 pt-6 space-y-6">

        <!-- 1. البث المباشر من المسجد الحرام -->
        <div class="rounded-3xl bg-white p-4 sm:p-6 shadow-card border border-olive-100 animate-fade">
            <div class="flex items-center justify-between mb-4 border-b border-olive-100 pb-3">
                <div class="flex items-center gap-3">
                    <div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-gold-400 text-white shadow-gold text-lg">
                        <i class="fa-solid fa-tower-broadcast"></i>
                    </div>
                    <div>
                        <h2 class="text-base sm:text-lg font-bold text-olive-600 font-serif">بث مباشر من المسجد الحرام</h2>
                        <p class="text-xs text-olive-300">قناة القرآن الكريم - Makkah Live</p>
                    </div>
                </div>
                <span class="inline-flex items-center gap-1.5 rounded-full bg-red-50 px-3 py-1 text-xs font-bold text-red-600 border border-red-200">
                    <span class="h-2 w-2 rounded-full bg-red-500 animate-pulse"></span>
                    بث حي
                </span>
            </div>

            <div class="relative w-full overflow-hidden rounded-2xl shadow-soft border border-olive-100" style="padding-top: 56.25%;">
                <iframe class="absolute top-0 left-0 w-full h-full border-0" 
                        src="https://www.youtube.com/embed/PLkCnLrKN8Q?autoplay=0&mute=0" 
                        title="البث المباشر لقناة القرآن الكريم" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                        allowfullscreen>
                </iframe>
            </div>
        </div>

        <!-- 2. البث المباشر من المسجد النبوي الشريف -->
        <div class="rounded-3xl bg-white p-4 sm:p-6 shadow-card border border-olive-100 animate-fade" style="animation-delay: 0.1s;">
            <div class="flex items-center justify-between mb-4 border-b border-olive-100 pb-3">
                <div class="flex items-center gap-3">
                    <div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-gold-400 text-white shadow-gold text-lg">
                        <i class="fa-solid fa-mosque"></i>
                    </div>
                    <div>
                        <h2 class="text-base sm:text-lg font-bold text-olive-600 font-serif">بث مباشر من المسجد النبوي</h2>
                        <p class="text-xs text-olive-300">قناة السنة النبوية - Madinah Live</p>
                    </div>
                </div>
                <span class="inline-flex items-center gap-1.5 rounded-full bg-red-50 px-3 py-1 text-xs font-bold text-red-600 border border-red-200">
                    <span class="h-2 w-2 rounded-full bg-red-500 animate-pulse"></span>
                    بث حي
                </span>
            </div>

            <div class="relative w-full overflow-hidden rounded-2xl shadow-soft border border-olive-100" style="padding-top: 56.25%;">
                <iframe class="absolute top-0 left-0 w-full h-full border-0" 
                        src="https://www.youtube.com/embed/018l4uYk4gU?autoplay=0&mute=0" 
                        title="البث المباشر لقناة السنة النبوية" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                        allowfullscreen>
                </iframe>
            </div>
        </div>

        <!-- 3. قناة إقرأ -->
        <div class="rounded-3xl bg-white p-4 sm:p-6 shadow-card border border-olive-100 animate-fade" style="animation-delay: 0.2s;">
            <div class="flex items-center justify-between mb-4 border-b border-olive-100 pb-3">
                <div class="flex items-center gap-3">
                    <div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-gold-400 text-white shadow-gold text-lg">
                        <i class="fa-solid fa-tv"></i>
                    </div>
                    <div>
                        <h2 class="text-base sm:text-lg font-bold text-olive-600 font-serif">قناة إقرأ الفضائية</h2>
                        <p class="text-xs text-olive-300">برامج إسلامية وتوعوية متنوعة</p>
                    </div>
                </div>
                <span class="inline-flex items-center gap-1.5 rounded-full bg-red-50 px-3 py-1 text-xs font-bold text-red-600 border border-red-200">
                    <span class="h-2 w-2 rounded-full bg-red-500 animate-pulse"></span>
                    بث حي
                </span>
            </div>

            <div class="relative w-full overflow-hidden rounded-2xl shadow-soft border border-olive-100" style="padding-top: 56.25%;">
                <iframe class="absolute top-0 left-0 w-full h-full border-0" 
                        src="https://www.youtube.com/embed/2w8tJXtafMg?autoplay=0&mute=0" 
                        title="قناة إقرأ الفضائية" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                        allowfullscreen>
                </iframe>
            </div>
        </div>

        <!-- 4. قناة الشيخ ابن عثيمين -->
        <div class="rounded-3xl bg-white p-4 sm:p-6 shadow-card border border-olive-100 animate-fade" style="animation-delay: 0.3s;">
            <div class="flex items-center justify-between mb-4 border-b border-olive-100 pb-3">
                <div class="flex items-center gap-3">
                    <div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-gold-400 text-white shadow-gold text-lg">
                        <i class="fa-solid fa-book-open"></i>
                    </div>
                    <div>
                        <h2 class="text-base sm:text-lg font-bold text-olive-600 font-serif">قناة الشيخ ابن عثيمين</h2>
                        <p class="text-xs text-olive-300">دروس علمية وشروح فقهية وعقدية</p>
                    </div>
                </div>
                <span class="inline-flex items-center gap-1.5 rounded-full bg-red-50 px-3 py-1 text-xs font-bold text-red-600 border border-red-200">
                    <span class="h-2 w-2 rounded-full bg-red-500 animate-pulse"></span>
                    بث حي
                </span>
            </div>

            <div class="relative w-full overflow-hidden rounded-2xl shadow-soft border border-olive-100" style="padding-top: 56.25%;">
                <iframe class="absolute top-0 left-0 w-full h-full border-0" 
                        src="https://www.youtube.com/embed/mjTfl-uxe9U?autoplay=0&mute=0" 
                        title="قناة الشيخ ابن عثيمين" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                        allowfullscreen>
                </iframe>
            </div>
        </div>

    </main>

</body>
</html>

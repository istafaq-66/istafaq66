<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الإذاعات الحية - البث المباشر</title>
    <!-- استيراد خط تجويد أو خط عربي عصري من جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* تنسيق الهيدر البسيط */
        header {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .live-indicator {
            background-color: #ef4444;
            color: white;
            font-size: 12px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            animation: pulse 2s infinite;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: white;
            border-radius: 50%;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* المحتوى الرئيسي ومركز البث */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .broadcast-container {
            width: 100%;
            max-width: 1100px;
            background: #1e293b;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* نسبة أبعاد الفيديو القياسية 16:9 */
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .broadcast-info {
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .broadcast-title h1 {
            font-size: 20px;
            font-weight: 700;
            color: #f8fafc;
        }

        .broadcast-title p {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 4px;
        }

        /* تنسيق الفوتر */
        footer {
            text-align: center;
            padding: 15px;
            background: #1e293b;
            color: #64748b;
            font-size: 13px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* التجاوب مع الشاشات الصغيرة */
        @media (max-width: 768px) {
            header {
                padding: 10px 15px;
            }
            .broadcast-container {
                border-radius: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- رأس الصفحة -->
    <header>
        <div class="logo-area">
            <h2>شبكة الإذاعات الحية</h2>
        </div>
        <div class="live-indicator">
            <span class="live-dot"></span>
            مباشر الآن
        </div>
    </header>

    <!-- المحتوى الرئيسي (الفيديو فقط) -->
    <main>
        <div class="broadcast-container">
            <div class="video-wrapper">
                <!-- تم استخراج معرف الفيديو PLkCnLrKN8Q ووضع رابط التضمين الصحيح -->
                <iframe src="https://www.youtube.com/embed/PLkCnLrKN8Q?autoplay=1&mute=0" 
                        title="البث المباشر للإذاعة" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                        allowfullscreen>
                </iframe>
            </div>
            <div class="broadcast-info">
                <div class="broadcast-title">
                    <h1>البث المباشر الرسمي</h1>
                    <p>استمع إلى أحدث البرامج والفقرات الإذاعية بجودة عالية.</p>
                </div>
            </div>
        </div>
    </main>

    <!-- تذييل الصفحة -->
    <footer>
        <p>جميع الحقوق محفوظة © 2026</p>
    </footer>

</body>
</html>

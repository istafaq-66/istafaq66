        :root {
            --olive-green: #384A34;
            --gold: #D4AF37;
            --pure-white: #FFFFFF;
            --bg-offwhite: #F4F6F3;
            --text-dark: #2C352A;
            --text-gray: #666666;
            --card-bg: #FFFFFF;
            --shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .dark-mode {
            --olive-green: #1E261C;
            --gold: #E5C158;
            --pure-white: #1A2118;
            --bg-offwhite: #121710;
            --text-dark: #E4E8E3;
            --text-gray: #A0A89F;
            --card-bg: #1A2118;
            --shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-offwhite);
            color: var(--text-dark);
            padding-bottom: 90px;
        }

        /* الهيدر العلوي */
        .app-header {
            background-color: var(--olive-green);
            color: var(--pure-white);
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header-right a {
            color: var(--pure-white);
            font-size: 1.2rem;
            text-decoration: none;
        }

        .app-logo-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gold);
            font-family: 'Amiri', serif;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-btn-header {
            background: rgba(255,255,255,0.1);
            border: none;
            color: var(--pure-white);
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* الحاوية الرئيسية */
        .container {
            padding: 1.2rem;
            max-width: 750px;
            margin: 0 auto;
        }

        .page-header-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 1rem 0;
        }

        .page-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--olive-green);
            font-family: 'Amiri', serif;
            display: flex;
            align-items: center;
            gap: 8px;
        }

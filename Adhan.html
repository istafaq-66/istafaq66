<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مواقيت الصلاة اليوم</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 450px;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .location {
            color: #16a085;
            font-weight: bold;
            margin-bottom: 25px;
        }
        .prayer-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 15px;
            margin: 8px 0;
            background-color: #f8f9fa;
            border-radius: 8px;
            border-right: 5px solid #1abc9c;
            font-size: 18px;
        }
        .prayer-name {
            font-weight: 600;
        }
        .prayer-time {
            color: #2c3e50;
            font-weight: bold;
        }
        .loading {
            font-size: 18px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>مواقيت الصلاة</h1>
    <!-- يمكنك تغيير اسم المدينة والدولة هنا لعرضها في الواجهة -->
    <div class="location" id="location-text">القاهرة، مصر</div>
    
    <div id="prayers-container">
        <div class="loading">جاري تحميل المواقيت...</div>
    </div>
</div>

<script>
    // إعدادات واجهة برمجة التطبيقات (API)
    const city = "Cairo";      // اكتب اسم المدينة بالإنجليزية هنا
    const country = "Egypt";   // اكتب اسم الدولة بالإنجليزية هنا
    const method = 5;          // طريقة الحساب (5 تعني الهيئة المصرية العامة للمساحة)

    // رابط الـ API الخاص بـ Aladhan
    const apiUrl = `https://aladhan.com{city}&country=${country}&method=${method}`;

    // أسماء الصلوات باللغة العربية لعرضها بدلاً من الإنجليزية
    const prayerNamesAr = {
        "Fajr": "الفجر",
        "Sunrise": "الشروق",
        "Dhuhr": "الظهر",
        "Asr": "العصر",
        "Maghrib": "المغرب",
        "Isha": "العشاء"
    };

    // دالة جلب البيانات من الـ API
    async function getPrayerTimes() {
        try {
            const response = await fetch(apiUrl);
            const result = await response.json();
            
            if (result.code === 200) {
                const timings = result.data.timings;
                const container = document.getElementById("prayers-container");
                container.innerHTML = ""; // مسح نص التحميل

                // الصلوات المُراد عرضها فقط
                const prayersToDisplay = ["Fajr", "Sunrise", "Dhuhr", "Asr", "Maghrib", "Isha"];

                prayersToDisplay.forEach(prayer => {
                    // إنشاء الصفوف وإضافتها للـ HTML
                    const row = document.createElement("div");
                    row.className = "prayer-row";
                    
                    row.innerHTML = `
                        <span class="prayer-name">${prayerNamesAr[prayer]}</span>
                        <span class="prayer-time">${timings[prayer]}</span>
                    `;
                    container.appendChild(row);
                });
            } else {
                document.getElementById("prayers-container").innerHTML = "<div class='loading'>حدث خطأ أثناء جلب البيانات.</div>";
            }
        } catch (error) {
            console.error("Error fetching data:", error);
            document.getElementById("prayers-container").innerHTML = "<div class='loading'>تعذر الاتصال بالخادم.</div>";
        }
    }

    // تشغيل الدالة فور تحميل الصفحة
    getPrayerTimes();
</script>

</body>
</html>

    <script>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html { font-family: 'Cairo', sans-serif; scroll-behavior: smooth; }
        body { background-color: #f7f8f6; color: #33442e; }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-down { animation: fadeInDown 0.6s ease-out forwards; }
        .animate-fade-up { animation: fadeInUp 0.6s ease-out forwards; }
        
        .book-card {
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(51, 68, 46, 0.15);
            border-color: #D4AF37;
        }
        .download-btn {
            transition: all 0.3s ease;
            background-color: #D4AF37;
            color: #222B1E;
        }
        .download-btn:hover {
            background-color: #33442E;
            color: #F5E9C0;
            transform: scale(1.02);
        }

</head>

                        <span>تحميل الكتاب PDF</span>

                    <div class="w-14 h-14 rounded-2xl bg-gold-50 text-gold-600 flex items-center justify-center text-2xl border border-gold-200 flex-shrink-0">
                        <i class="fa-solid fa-book-bookmark"></i>
                    </div>
                    <div class="space-y-1">

                        <span>تحميل الكتاب PDF</span>

            </div>

                        <i class="fa-solid fa-book-bookmark"></i>

                    <div class="space-y-1">

                        <p class="text-xs text-olive-400">للإمام الترمذي</p>
                    </div>
                </div>
                <div class="pt-2 border-t border-cream flex justify-end">

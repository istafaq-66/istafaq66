<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الكتب الصوتية - منصة إِصْطَفَاكَ</title>
    <!-- Font Awesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#F7F8F6',
                        olive: {
                            50: '#E8EDE5',
                            100: '#D2DBCC',
                            200: '#A7B69E',
                            300: '#7C9070',
                            400: '#566B4A',
                            500: '#33442E',
                            600: '#2A3725',
                            700: '#222B1E',
                            800: '#1A2117',
                            900: '#121610',
                        },
                        gold: {
                            50: '#FBF6E3',
                            100: '#F5E9C0',
                            200: '#EBD489',
                            300: '#E0BF5A',
                            400: '#D4AF37',
                            500: '#B8962C',
                            600: '#9A7C24',
                            700: '#74611B',
                            800: '#4E4113',
                            900: '#2E270C',
                        },
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                        amiri: ['Amiri', 'serif'],
                    },
                    boxShadow: {
                        soft: '0 4px 20px rgba(51, 68, 46, 0.08)',
                        card: '0 10px 30px rgba(51, 68, 46, 0.12)',
                        gold: '0 4px 20px rgba(212, 175, 55, 0.3)',
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html { font-family: 'Cairo', sans-serif; scroll-behavior: smooth; }
        body { background-color: #f7f8f6; color: #33442e; }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-down { animation: fadeInDown 0.6s ease-out forwards; }
        .animate-fade-up { animation: fadeInUp 0.6s ease-out forwards; }
        
        .audio-card {
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .audio-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(51, 68, 46, 0.15);
            border-color: #D4AF37;
        }
        
        audio {
            width: 100%;
            height: 45px;
            border-radius: 12px;
            outline: none;
        }
        
        .download-btn {
            transition: all 0.3s ease;
            background-color: #D4AF37;
            color: #222B1E;
        }
        .download-btn:hover {
            background-color: #33442E;
            color: #F5E9C0;
            transform: scale(1.02);
        }
    </style>
</head>
<body class="min-h-screen pb-16">

    <!-- الهيدر العلوي -->
    <header class="sticky top-0 z-30 bg-[#3A4E35] text-white shadow-lg rounded-b-[30px] px-6 py-4 border-b-2 border-[#D4AF37]">
        <div class="mx-auto flex max-w-4xl items-center justify-between">
            <button onclick="history.back()" class="flex items-center gap-2 rounded-xl bg-[#D4AF37] text-[#222B1E] px-4 py-2 text-sm font-bold transition-all hover:bg-white hover:text-[#33442E] shadow-md">
                <i class="fa-solid fa-arrow-right"></i>
                <span>السابق</span>
            </button>
            <h1 class="text-xl font-bold font-serif text-[#F5E9C0]">قسم الكتب الصوتية</h1>
            <a href="index.html" class="flex items-center gap-2 rounded-xl bg-[#D4AF37] text-[#222B1E] px-4 py-2 text-sm font-bold transition-all hover:bg-white hover:text-[#33442E] shadow-md">
                <span>الرئيسية</span>
                <i class="fa-solid fa-home"></i>
            </a>
        </div>
    </header>

    <main class="mx-auto max-w-4xl px-4 pt-8 space-y-8">

        <!-- العنوان الرئيسي -->
        <div class="text-center space-y-2 animate-fade-down">
            <h2 class="text-2xl sm:text-3xl font-bold font-serif text-olive-700">المكتبة الصوتية والشروح</h2>
            <p class="text-sm sm:text-base text-olive-500">استمع مباشرة إلى الدروس الصوتية أو قم بتحميلها بصيغة MP3</p>
        </div>

        <!-- قائمة الكتب الصوتية -->
        <div class="grid grid-cols-1 gap-6 animate-fade-up">

            <!-- الكتاب الصوتي الأول -->
            <div class="audio-card bg-white rounded-3xl p-6 shadow-card border border-olive-100 flex flex-col gap-4">
                <div class="flex items-start gap-4">
                    <div class="w-14 h-14 rounded-2xl bg-gold-50 text-gold-600 flex items-center justify-center text-2xl border border-gold-200 flex-shrink-0">
                        <i class="fa-solid fa-headphones-simple"></i>
                    </div>
                    <div class="space-y-1">
                        <h3 class="text-lg font-bold text-olive-700 font-serif">سورة الأعراف (تلاوة عطرة)</h3>
                        <p class="text-xs text-olive-400">استمع إلى التلاوة المباشرة أو قم بتحميلها</p>
                    </div>
                </div>

                <!-- مشغل الصوت المدمج -->
                <div class="bg-cream p-3 rounded-2xl border border-olive-100">
                    <audio controls controlsList="nodownload">
                        <source src="https://server6.mp3quran.net/akdr/007.mp3" type="audio/mp3">
                        متصفحك لا يدعم تشغيل الملفات الصوتية.
                    </audio>
                </div>

                <!-- زر التحميل المنفصل -->
                <div class="flex justify-end pt-1">
                    <a href="https://server6.mp3quran.net/akdr/007.mp3" download class="download-btn w-full sm:w-auto flex items-center justify-center gap-2 px-6 py-3 rounded-2xl text-sm font-bold shadow-soft">
                        <i class="fa-solid fa-download text-lg"></i>
                        <span>تحميل التلاوة (MP3)</span>
                    </a>
                </div>
            </div>

            <!-- الكتاب الصوتي الثاني -->
            <div class="audio-card bg-white rounded-3xl p-6 shadow-card border border-olive-100 flex flex-col gap-4">
                <div class="flex items-start gap-4">
                    <div class="w-14 h-14 rounded-2xl bg-gold-50 text-gold-600 flex items-center justify-center text-2xl border border-gold-200 flex-shrink-0">
                        <i class="fa-solid fa-headphones-simple"></i>
                    </div>
                    <div class="space-y-1">
                        <h3 class="text-lg font-bold text-olive-700 font-serif">سورة الأعراف - نسخة إضافية</h3>
                        <p class="text-xs text-olive-400">استماع مباشر ومتابعة سلسة</p>
                    </div>
                </div>

                <!-- مشغل الصوت المدمج -->
                <div class="bg-cream p-3 rounded-2xl border border-olive-100">
                    <audio controls controlsList="nodownload">
                        <source src="https://server6.mp3quran.net/akdr/007.mp3" type="audio/mp3">
                        متصفحك لا يدعم تشغيل الملفات الصوتية.
                    </audio>
                </div>

                <!-- زر التحميل المنفصل -->
                <div class="flex justify-end pt-1">
                    <a href="https://server6.mp3quran.net/akdr/007.mp3" download class="download-btn w-full sm:w-auto flex items-center justify-center gap-2 px-6 py-3 rounded-2xl text-sm font-bold shadow-soft">
                        <i class="fa-solid fa-download text-lg"></i>
                        <span>تحميل التلاوة (MP3)</span>
                    </a>
                </div>
            </div>

        </div>

    </main>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تطبيق إصطفاك - قسم القرآن الكريم</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#F7F8F6',
                        olive: {
                            50: '#E8EDE5',
                            100: '#D2DBCC',
                            200: '#A7B69E',
                            300: '#7C9070',
                            400: '#566B4A',
                            500: '#33442E',
                            600: '#2A3725',
                            700: '#222B1E',
                            800: '#1A2117',
                            900: '#121610',
                        },
                        gold: {
                            50: '#FBF6E3',
                            100: '#F5E9C0',
                            200: '#EBD489',
                            300: '#E0BF5A',
                            400: '#D4AF37',
                            500: '#B8962C',
                            600: '#9A7C24',
                            700: '#74611B',
                            800: '#4E4113',
                            900: '#2E270C',
                        },
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                        amiri: ['Amiri', 'serif'],
                    },
                    boxShadow: {
                        soft: '0 4px 20px rgba(51, 68, 46, 0.08)',
                        card: '0 8px 30px rgba(51, 68, 46, 0.12)',
                        gold: '0 4px 20px rgba(212, 175, 55, 0.3)',
                    }
                }
            }
        }
    </script>
    <style>
        html { font-family: 'Cairo', sans-serif; scroll-behavior: smooth; }
        body { background-color: #f7f8f6; color: #33442e; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.6s ease-out forwards; }
        
        .section-card {
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .section-card:hover {
            transform: translateY(-5px);
            border-color: #D4AF37;
            box-shadow: 0 12px 35px rgba(56, 74, 52, 0.15);
        }

        .card-icon {
            transition: all 0.3s ease;
        }
        .section-card:hover .card-icon {
            transform: scale(1.1) rotate(5deg);
            background-color: #33442E;
            color: #D4AF37;
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- الهيدر العلوي مطابق للصورة تماماً -->
    <header class="sticky top-0 z-30 bg-olive-500 text-white shadow-card rounded-b-[30px] px-6 py-4">
        <div class="mx-auto flex max-w-3xl items-center justify-between">
            <button onclick="history.back()" class="flex items-center gap-2 rounded-xl bg-white/10 px-4 py-2 text-sm font-medium transition-all hover:bg-white/20">
                <i class="fa-solid fa-arrow-right"></i>
                <span>العودة</span>
            </button>
            <h1 class="text-xl font-bold font-serif text-gold-400">قسم القرآن الكريم</h1>
            <a href="index.html" class="flex items-center gap-2 rounded-xl bg-white/10 px-4 py-2 text-sm font-medium transition-all hover:bg-white/20">
                <span>الرئيسية</span>
                <i class="fa-solid fa-home"></i>
            </a>
        </div>
    </header>

    <main class="mx-auto max-w-3xl px-4 pt-6 space-y-4">

        <!-- 1. البطاقة الترحيبية العلوية -->
        <div class="section-card rounded-3xl bg-white p-6 shadow-card border border-olive-100 text-center animate-fade">
            <h2 class="text-xl font-bold font-serif text-olive-600 mb-1">قسم القرآن الكريم</h2>
            <p class="text-xs sm:text-sm text-olive-400">اختر القسم الفرعي المطلوب:</p>
        </div>

        <!-- 2. الأيقونة الأولى: مخططات وبرامج المراجعة -->
        <a href="revision-plans.html" class="section-card rounded-3xl bg-white p-5 sm:p-6 shadow-card border border-olive-100 flex items-center justify-between group animate-fade" style="animation-delay: 0.1s;">
            <div class="flex items-center gap-4">
                <!-- الأيقونة المربعة تماماً مثل الصورة -->
                <div class="card-icon flex h-16 w-16 sm:h-20 sm:w-20 items-center justify-center rounded-2xl bg-gold-50 text-gold-600 text-2xl sm:text-3xl shadow-soft border border-gold-200 flex-shrink-0">
                    <i class="fa-solid fa-calendar-days"></i>
                </div>
                <div>
                    <h3 class="text-base sm:text-lg font-bold text-olive-600 font-serif mb-1 group-hover:text-gold-600 transition-colors">مخططات وبرامج المراجعة</h3>
                    <p class="text-xs sm:text-sm text-olive-400">دورة الختمة السباعية وقاعدة الأقسام الثلاثة</p>
                </div>
            </div>
            <!-- سهم التنقل الجانبي -->
            <div class="flex h-10 w-10 items-center justify-center rounded-full bg-cream text-olive-400 group-hover:bg-olive-500 group-hover:text-white transition-all flex-shrink-0">
                <i class="fa-solid fa-chevron-left text-xs"></i>
            </div>
        </a>

        <!-- 3. الأيقونة الثانية: بوابة القرآن الكريم -->
        <a href="quran-gateway.html" class="section-card rounded-3xl bg-white p-5 sm:p-6 shadow-card border border-olive-100 flex items-center justify-between group animate-fade" style="animation-delay: 0.2s;">
            <div class="flex items-center gap-4">
                <!-- الأيقونة المربعة تماماً مثل الصورة -->
                <div class="card-icon flex h-16 w-16 sm:h-20 sm:w-20 items-center justify-center rounded-2xl bg-gold-50 text-gold-600 text-2xl sm:text-3xl shadow-soft border border-gold-200 flex-shrink-0">
                    <i class="fa-solid fa-book-quran"></i>
                </div>
                <div>
                    <h3 class="text-base sm:text-lg font-bold text-olive-600 font-serif mb-1 group-hover:text-gold-600 transition-colors">بوابة القرآن الكريم</h3>
                    <p class="text-xs sm:text-sm text-olive-400">منصات علوم القرآن، قنوات تليجرام، ويوتيوب</p>
                </div>
            </div>
            <!-- سهم التنقل الجانبي -->
            <div class="flex h-10 w-10 items-center justify-center rounded-full bg-cream text-olive-400 group-hover:bg-olive-500 group-hover:text-white transition-all flex-shrink-0">
                <i class="fa-solid fa-chevron-left text-xs"></i>
            </div>
        </a>

    </main>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تطبيق إصطفاك - أفكاري وملاحظاتي ومنبهاتي</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <!-- Google Fonts Cairo & Amiri -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#F7F8F6',
                        olive: {
                            50: '#E8EDE5',
                            100: '#D2DBCC',
                            200: '#A7B69E',
                            300: '#7C9070',
                            400: '#566B4A',
                            500: '#33442E',
                            600: '#2A3725',
                            700: '#222B1E',
                            800: '#1A2117',
                            900: '#121610',
                        },
                        gold: {
                            50: '#FBF6E3',
                            100: '#F5E9C0',
                            200: '#EBD489',
                            300: '#E0BF5A',
                            400: '#D4AF37',
                            500: '#B8962C',
                            600: '#9A7C24',
                            700: '#74611B',
                            800: '#4E4113',
                            900: '#2E270C',
                        },
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                        amiri: ['Amiri', 'serif'],
                    },
                    boxShadow: {
                        soft: '0 2px 12px rgba(51, 68, 46, 0.06)',
                        card: '0 4px 24px rgba(51, 68, 46, 0.08)',
                        gold: '0 4px 20px rgba(212, 175, 55, 0.25)',
                    }
                }
            }
        }
    </script>
    <style>
        html { font-family: 'Cairo', sans-serif; }
        body { background-color: #f7f8f6; color: #33442e; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const INITIAL_NOTES = [
            {
                id: 1,
                title: 'خطة حفظ سورة البقرة',
                content: 'التركيز على مراجعة الأوجه الجديدة بعد صلاة الفجر مباشرة، وتثبيت المتشابهات بين الآيات (150-180).',
                category: 'general',
                link: '',
                time: '',
                date: '2026-06-01',
                reminderActive: false
            },
            {
                id: 2,
                title: 'رابط تلاوة خاشعة للشيخ عبد الرحمن السديس',
                content: 'استماع لتلاوة سورة مريم بتدبر وخشوع.',
                category: 'link',
                link: 'https://youtube.com',
                time: '',
                date: '2026-06-02',
                reminderActive: false
            },
            {
                id: 3,
                title: 'بودكاست تفسير آيات الصيام',
                content: 'حلقة ممتازة للتدبر في أحكام شهر رمضان والقيام.',
                category: 'podcast',
                link: 'https://ar.islamway.net',
                time: '21:30',
                date: '2026-06-03',
                reminderActive: true
            },
            {
                id: 4,
                title: 'خواطر إيمانية وتدبرات',
                content: 'إن الله لا يغير ما بقوم حتى يغيروا ما بأنفسهم. العمل الحقيقي يبدأ من إصلاح النية والسريرة.',
                category: 'general',
                link: '',
                time: '',
                date: '2026-06-04',
                reminderActive: false
            }
        ];

        function App() {
            const [notes, setNotes] = useState(() => {
                try {
                    const saved = localStorage.getItem('istafak_advanced_notes');
                    return saved ? JSON.parse(saved) : INITIAL_NOTES;
                } catch { return INITIAL_NOTES; }
            });

            const [filter, setFilter] = useState('all');
            const [searchQuery, setSearchQuery] = useState('');
            const [showAddModal, setShowAddModal] = useState(false);

            // نموذج إضافة ملاحظة جديدة
            const [newTitle, setNewTitle] = useState('');
            const [newContent, setNewContent] = useState('');
            const [newCategory, setNewCategory] = useState('general');
            const [newLink, setNewLink] = useState('');
            const [newTime, setNewTime] = useState('');
            const [newDate, setNewDate] = useState(() => new Date().toISOString().split('T')[0]);
            const [newReminderActive, setNewReminderActive] = useState(false);

            // حالات المنبه الصوتي المنبثق
            const [activeAlarm, setActiveAlarm] = useState(null);
            const audioCtxRef = useRef(null);
            const alarmIntervalRef = useRef(null);

            // حفظ الملاحظات في الذاكرة طويلة المدى
            useEffect(() => {
                try {
                    localStorage.setItem('istafak_advanced_notes', JSON.stringify(notes));
                } catch (e) {}
            }, [notes]);

            // مراقبة المنبهات وحلول الوقت
            useEffect(() => {
                const checkAlarms = () => {
                    const now = new Date();
                    const hh = String(now.getHours()).padStart(2, '0');
                    const mm = String(now.getMinutes()).padStart(2, '0');
                    const nowStr = `${hh}:${mm}`;
                    const todayStr = now.toISOString().split('T')[0];

                    notes.forEach(note => {
                        if (note.reminderActive && note.time === nowStr && (!note.date || note.date === todayStr)) {
                            if (!activeAlarm || activeAlarm.id !== note.id) {
                                setActiveAlarm(note);
                                playAlarmSound();
                                if (!alarmIntervalRef.current) {
                                    alarmIntervalRef.current = setInterval(playAlarmSound, 4000);
                                }
                            }
                        }
                    });
                };

                const interval = setInterval(checkAlarms, 10000);
                return () => clearInterval(interval);
            }, [notes, activeAlarm]);

            const playAlarmSound = () => {
                try {
                    if (!audioCtxRef.current) {
                        audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
                    }
                    const ctx = audioCtxRef.current;
                    if (ctx.state === 'suspended') { ctx.resume(); }

                    const notesFreq = [523.25, 659.25, 783.99, 1046.50];
                    notesFreq.forEach((freq, idx) => {
                        setTimeout(() => {
                            if (!audioCtxRef.current) return;
                            const osc = ctx.createOscillator();
                            const gain = ctx.createGain();
                            osc.type = 'sine';
                            osc.frequency.value = freq;
                            gain.gain.setValueAtTime(0.2, ctx.currentTime);
                            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
                            osc.connect(gain);
                            gain.connect(ctx.destination);
                            osc.start();
                            osc.stop(ctx.currentTime + 0.6);
                        }, idx * 180);
                    });
                } catch (e) {}

                if ('vibrate' in navigator) {
                    try { navigator.vibrate([300, 150, 300, 150, 500]); } catch (e) {}
                }
            };

            const stopAlarm = () => {
                setActiveAlarm(null);
                if (alarmIntervalRef.current) {
                    clearInterval(alarmIntervalRef.current);
                    alarmIntervalRef.current = null;
                }
            };

            const handleAddNote = (e) => {
                e.preventDefault();
                if (!newTitle.trim() && !newContent.trim()) return;

                const item = {
                    id: Date.now(),
                    title: newTitle.trim() || 'ملاحظة بدون عنوان',
                    content: newContent.trim(),
                    category: newCategory,
                    link: newLink.trim(),
                    time: newReminderActive ? newTime : '',
                    date: newDate,
                    reminderActive: newReminderActive
                };

                setNotes(prev => [item, ...prev]);
                // إعادة تعيين الحقول
                setNewTitle('');
                setNewContent('');
                setNewLink('');
                setNewTime('');
                setNewReminderActive(false);
                setShowAddModal(false);
            };

            const deleteNote = (id) => {
                if (confirm('هل أنت متأكد من حذف هذه الملاحظة؟')) {
                    setNotes(prev => prev.filter(n => n.id !== id));
                }
            };

            const toggleReminder = (id) => {
                setNotes(prev => prev.map(n => {
                    if (n.id === id) {
                        return { ...n, reminderActive: !n.reminderActive };
                    }
                    return n;
                }));
            };

            const filteredNotes = useMemo(() => {
                return notes.filter(n => {
                    const matchesFilter = filter === 'all' || n.category === filter;
                    const matchesSearch = n.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                          n.content.toLowerCase().includes(searchQuery.toLowerCase());
                    return matchesFilter && matchesSearch;
                });
            }, [notes, filter, searchQuery]);

            return (
                <div className="min-h-screen pb-24 relative">
                    {/* نافذة التنبيه المنبثقة */}
                    {activeAlarm && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4 backdrop-blur-sm">
                            <div className="w-full max-w-sm rounded-3xl bg-white p-6 shadow-card text-center animate-bounce">
                                <div className="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-gold-400 text-white shadow-gold animate-pulse">
                                    <i className="fa-solid fa-bell text-3xl" />
                                </div>
                                <h3 className="text-xl font-bold text-olive-600 mb-2">تنبيه من ملاحظاتك!</h3>
                                <p className="text-base font-bold text-olive-500 mb-1">{activeAlarm.title}</p>
                                <p className="text-sm text-olive-300 mb-6">{activeAlarm.content || 'حان موعد المنبه المحدد.'}</p>
                                <button onClick={stopAlarm} className="w-full rounded-xl bg-olive-500 py-3 text-sm font-bold text-white shadow-soft transition-all hover:bg-olive-600">
                                    إيقاف التنبيه ومتابعة القراءة
                                </button>
                            </div>
                        </div>
                    )}

                    {/* الهيدر العلوي */}
                    <header className="sticky top-0 z-30 border-b border-olive-100 bg-white/90 backdrop-blur-md shadow-soft">
                        <div className="mx-auto flex max-w-4xl items-center justify-between px-4 py-3 sm:px-6">
                            <a href="index.html" className="flex items-center gap-2 rounded-xl bg-cream px-3 py-2 text-sm font-medium text-olive-500 shadow-soft transition-all hover:bg-olive-550">
                                <i className="fa-solid fa-arrow-right" />
                                <span>الرئيسية</span>
                            </a>
                            <h1 className="font-bold text-olive-600 font-serif text-lg">أفكاري وملاحظاتي</h1>
                            <button onClick={() => setShowAddModal(true)} className="flex items-center gap-1.5 rounded-xl bg-gold-400 px-4 py-2 text-xs font-bold text-white shadow-gold hover:bg-gold-500">
                                <i className="fa-solid fa-plus" />
                                <span>إضافة جديدة</span>
                            </button>
                        </div>
                    </header>

                    <main className="mx-auto max-w-4xl px-4 pt-6 sm:px-6">
                        {/* شريط البحث والتصفية */}
                        <div className="mb-6 space-y-3">
                            <div className="relative">
                                <i className="fa-solid fa-search absolute right-4 top-3.5 text-olive-300" />
                                <input 
                                    type="text" 
                                    placeholder="ابحث في ملاحظاتك، الروابط، أو البودكاست..." 
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className="w-full rounded-2xl border border-olive-100 bg-white py-3 pr-11 pl-4 text-sm text-olive-600 shadow-soft outline-none focus:border-gold-400"
                                />
                            </div>

                            <div className="flex gap-2 overflow-x-auto pb-2 scrollbar-none">
                                <button onClick={() => setFilter('all')} className={`rounded-xl px-4 py-2 text-xs font-bold transition-all whitespace-nowrap ${filter === 'all' ? 'bg-olive-500 text-white shadow-soft' : 'bg-white text-olive-400 border border-olive-100'}`}>
                                    الكل ({notes.length})
                                </button>
                                <button onClick={() => setFilter('general')} className={`rounded-xl px-4 py-2 text-xs font-bold transition-all whitespace-nowrap ${filter === 'general' ? 'bg-olive-500 text-white shadow-soft' : 'bg-white text-olive-400 border border-olive-100'}`}>
                                    <i className="fa-solid fa-pen-nib ml-1" /> خواطر عامة
                                </button>
                                <button onClick={() => setFilter('link')} className={`rounded-xl px-4 py-2 text-xs font-bold transition-all whitespace-nowrap ${filter === 'link' ? 'bg-olive-500 text-white shadow-soft' : 'bg-white text-olive-400 border border-olive-100'}`}>
                                    <i className="fa-solid fa-link ml-1" /> الروابط المفيدة
                                </button>
                                <button onClick={() => setFilter('podcast')} className={`rounded-xl px-4 py-2 text-xs font-bold transition-all whitespace-nowrap ${filter === 'podcast' ? 'bg-olive-500 text-white shadow-soft' : 'bg-white text-olive-400 border border-olive-100'}`}>
                                    <i className="fa-solid fa-headphones ml-1" /> بودكاست وصوتيات
                                </button>
                            </div>
                        </div>

                        {/* قائمة الملاحظات */}
                        {filteredNotes.length === 0 ? (
                            <div className="rounded-3xl bg-white p-12 text-center shadow-card border border-olive-100">
                                <div className="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-olive-50 text-olive-400 text-2xl">
                                    <i className="fa-solid fa-folder-open" />
                                </div>
                                <h3 className="text-lg font-bold text-olive-600 mb-1">لا توجد ملاحظات مطابقة</h3>
                                <p className="text-sm text-olive-300">قم بإضافة ملاحظة جديدة أو رابط أو بودكاست للبدء.</p>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 gap-4 sm:grid-cols-2">
                                {filteredNotes.map(note => (
                                    <div key={note.id} className="rounded-2xl bg-white p-5 shadow-card border border-olive-100 flex flex-col justify-between transition-all hover:-translate-y-0.5">
                                        <div>
                                            <div className="mb-3 flex items-center justify-between">
                                                <span className={`rounded-full px-3 py-1 text-xs font-semibold ${
                                                    note.category === 'podcast' ? 'bg-amber-50 text-amber-600 border border-amber-200' :
                                                    note.category === 'link' ? 'bg-blue-50 text-blue-600 border border-blue-200' :
                                                    'bg-olive-50 text-olive-600 border border-olive-200'
                                                }`}>
                                                    <i className={`fa-solid ${
                                                        note.category === 'podcast' ? 'fa-headphones' :
                                                        note.category === 'link' ? 'fa-link' : 'fa-pen-nib'
                                                    } ml-1`} />
                                                    {note.category === 'podcast' ? 'بودكاست' : note.category === 'link' ? 'رابط مفيد' : 'خاطرة'}
                                                </span>
                                                <div className="flex items-center gap-1 text-xs text-olive-300">
                                                    <i className="fa-regular fa-calendar ml-1" />
                                                    {note.date}
                                                </div>
                                            </div>

                                            <h3 className="text-base font-bold text-olive-600 mb-2 font-serif">{note.title}</h3>
                                            <p className="text-sm text-olive-500 leading-relaxed mb-4 whitespace-pre-wrap">{note.content}</p>

                                            {note.link && (
                                                <a href={note.link} target="_blank" rel="noopener noreferrer" className="mb-4 inline-flex items-center gap-2 rounded-xl bg-cream px-3 py-2 text-xs font-semibold text-gold-600 border border-gold-200 hover:bg-gold-50 w-full truncate">
                                                    <i className="fa-solid fa-external-link-alt" />
                                                    <span className="truncate">{note.link}</span>
                                                </a>
                                            )}
                                        </div>

                                        <div className="pt-3 border-t border-olive-50 flex items-center justify-between">
                                            <div className="flex items-center gap-2">
                                                <button onClick={() => toggleReminder(note.id)} className={`flex items-center gap-1 rounded-lg px-2.5 py-1.5 text-xs font-semibold border transition-all ${note.reminderActive ? 'bg-gold-50 text-gold-600 border-gold-300' : 'bg-cream text-olive-300 border-olive-100'}`}>
                                                    <i className="fa-solid fa-bell" />
                                                    <span>{note.reminderActive && note.time ? note.time : 'منبه'}</span>
                                                </button>
                                            </div>
                                            <button onClick={() => deleteNote(note.id)} className="text-red-400 hover:text-red-600 p-1.5 text-sm transition-colors" title="حذف">
                                                <i className="fa-solid fa-trash-can" />
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    {/* نافذة إضافة ملاحظة أو منبه جديد */}
                    {showAddModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4 backdrop-blur-sm overflow-y-auto">
                            <div className="w-full max-w-md rounded-3xl bg-white p-6 shadow-card my-8">
                                <div className="flex items-center justify-between mb-4">
                                    <h3 className="text-lg font-bold text-olive-600 font-serif">إضافة ملاحظة أو منبه جديد</h3>
                                    <button onClick={() => setShowAddModal(false)} className="text-olive-300 hover:text-olive-600 p-1">
                                        <i className="fa-solid fa-xmark text-lg" />
                                    </button>
                                </div>

                                <form onSubmit={handleAddNote} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-olive-500 mb-1">نوع المحتوى</label>
                                        <select 
                                            value={newCategory} 
                                            onChange={(e) => setNewCategory(e.target.value)}
                                            className="w-full rounded-xl border border-olive-100 bg-cream px-3 py-2.5 text-sm font-semibold text-olive-600 outline-none focus:border-gold-400"
                                        >
                                            <option value="general">خاطرة / ملاحظة عامة</option>
                                            <option value="link">رابط موقع مفيد</option>
                                            <option value="podcast">بودكاست أو ملف صوتي</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-olive-500 mb-1">عنوان الملاحظة أو البودكاست</label>
                                        <input 
                                            type="text" 
                                            placeholder="مثال: فوائد من تفسير سورة النور..." 
                                            value={newTitle}
                                            onChange={(e) => setNewTitle(e.target.value)}
                                            className="w-full rounded-xl border border-olive-100 bg-cream px-3 py-2.5 text-sm text-olive-600 outline-none focus:border-gold-400"
                                            required
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-olive-500 mb-1">التفاصيل أو النص</label>
                                        <textarea 
                                            rows="3"
                                            placeholder="اكتب تفاصيل الملاحظة هنا..." 
                                            value={newContent}
                                            onChange={(e) => setNewContent(e.target.value)}
                                            className="w-full rounded-xl border border-olive-100 bg-cream px-3 py-2.5 text-sm text-olive-600 outline-none focus:border-gold-400 resize-none"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-olive-500 mb-1">رابط إضافي أو بودكاست (اختياري)</label>
                                        <input 
                                            type="url" 
                                            placeholder="https://example.com" 
                                            value={newLink}
                                            onChange={(e) => setNewLink(e.target.value)}
                                            className="w-full rounded-xl border border-olive-100 bg-cream px-3 py-2.5 text-sm text-olive-600 outline-none focus:border-gold-400"
                                        />
                                    </div>

                                    <div className="rounded-2xl border border-olive-100 bg-cream p-4 space-y-3">
                                        <div className="flex items-center justify-between">
                                            <span className="text-xs font-bold text-olive-600">ضبط منبه لهذه الملاحظة</span>
                                            <input 
                                                type="checkbox" 
                                                checked={newReminderActive}
                                                onChange={(e) => setNewReminderActive(e.target.checked)}
                                                className="h-4 w-4 rounded accent-olive-500 cursor-pointer"
                                            />
                                        </div>
                                        {newReminderActive && (
                                            <div className="grid grid-cols-2 gap-3 pt-2">
                                                <div>
                                                    <label className="block text-[11px] text-olive-400 mb-1">وقت التنبيه</label>
                                                    <input 
                                                        type="time" 
                                                        value={newTime}
                                                        onChange={(e) => setNewTime(e.target.value)}
                                                        className="w-full rounded-xl border border-olive-100 bg-white px-3 py-2 text-sm font-bold text-olive-600 outline-none"
                                                        required={newReminderActive}
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-[11px] text-olive-400 mb-1">التاريخ</label>
                                                    <input 
                                                        type="date" 
                                                        value={newDate}
                                                        onChange={(e) => setNewDate(e.target.value)}
                                                        className="w-full rounded-xl border border-olive-100 bg-white px-3 py-2 text-xs font-semibold text-olive-600 outline-none"
                                                    />
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    <div className="flex gap-3 pt-2">
                                        <button type="submit" className="flex-1 rounded-xl bg-olive-500 py-3 text-sm font-bold text-white shadow-soft transition-all hover:bg-olive-600">
                                            حفظ الملاحظة
                                        </button>
                                        <button type="button" onClick={() => setShowAddModal(false)} className="rounded-xl bg-cream px-4 py-3 text-sm font-semibold text-olive-400 border border-olive-100">
                                            إلغاء
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
